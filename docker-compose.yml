services:
  superar1_sig:
    build: .

    container_name: superar1_sig

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: America/Guayaquil
      DB_HOST: mariadb

    ports:
      - "8084:80"

    volumes:
      - ./timezone.ini:/usr/local/etc/php/conf.d/99-timezone.ini:ro
      - ./uploads.ini:/usr/local/etc/php/conf.d/98-uploads.ini:ro
      - ./public/uploads:/var/www/html/public/uploads

    networks:
      - moodle_net

networks:
  moodle_net:
    external: true
