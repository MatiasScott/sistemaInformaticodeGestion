services:
  superar1_sig:
    build: .

    container_name: superar1_sig

    restart: unless-stopped

    ports:
      - "8084:80"

    env_file:
      - .env

    environment:
      DB_HOST: mariadb

    volumes:
      - sig_uploads:/var/www/html/public/uploads

    networks:
      - moodle_net

volumes:
  sig_uploads:

networks:
  moodle_net:
    external: true
